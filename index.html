<!DOCTYPE html>
<!-- assembly-vote 現場系統：GitHub 載入器（這個檔案幾乎不用改）
     每次開啟都從 GitHub 抓最新的 app.html（不用手機暫存），所以更新 app.html 後所有手機重新開啟就是新版
     版本：v0.8.3  2026-10-26（新增） -->
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>區權會現場系統</title>
<style>body{margin:0;font-family:-apple-system,"PingFang TC",sans-serif;background:#f5f6f8;color:#5f6b7a;display:flex;align-items:center;justify-content:center;height:100vh;font-size:18px}</style>
</head><body><div id="m">載入最新版本中…</div>
<script>
window.APP_FILE = 'app.html';
(function load(tries) {
  fetch('app.html?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (html) { document.open(); document.write(html.replace('<head>', '<head><script>window.APP_FILE="app.html";<\/script>')); document.close(); })
    .catch(function () {
      if (tries < 3) return setTimeout(function () { load(tries + 1); }, 1500);
      document.getElementById('m').innerHTML = '網路連線不穩，請確認手機有網路後<br><a href="javascript:location.reload()">點這裡重新載入</a>';
    });
})(0);
</script></body></html>
