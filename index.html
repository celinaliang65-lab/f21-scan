<!DOCTYPE html>
<!-- assembly-vote 現場系統：手機掃描頁（報到／唱票／監票管理）  v0.4.0  2026-10-26
     兩種用法（同一個檔案）：
     1. 貼在 Apps Script 裡（Google 網址）：可登入、手動輸入、拍照掃描；但 Google 網頁外框不允許即時相機
     2. 放在 GitHub Pages 等外部網址（建議）：即時相機可用；透過 Apps Script 的 API 讀寫同一份試算表
        API 網址：改下面的 API_URL，或網址後面加 ?api=部署ID（會記在這支手機）
     v0.7.0：報到可模糊查詢住戶（戶別、樓層、地址、姓名），點選直接帶出；報到畫面顯示地址
     v0.6.0：送出時附上「掃到→送出」秒數（會後分析用）；報到畫面姓名與比例同一列、字放大
     v0.5.2：一人可有多個角色（例：報到、唱票），登入後兩個分頁都有
     v0.5.1：用相機掃描後不再自動跳到輸入框（手機不會跳出鍵盤）
     v0.5.0：掃描更靈敏＋掃到時嗶聲／震動／綠框並暫停相機；所有人員新增「進度」分頁
     v0.4.0：新增外部網址模式、「拍照掃描」按鈕；v0.3.0：方案類按鈕、議題顯示編號 -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#f5f6f8; --card:#fff; --txt:#1d2433; --sub:#5f6b7a; --line:#d9dee5; --blue:#185FA5; --green:#0F6E56; --red:#A32D2D; --amber:#854F0B; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:var(--txt); font-size:16px; }
  .wrap { max-width:520px; margin:0 auto; padding:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  h1 { font-size:20px; margin:4px 0 12px; font-weight:600; }
  label { display:block; font-size:14px; color:var(--sub); margin:10px 0 4px; }
  input, select { width:100%; font-size:18px; padding:10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  button { font-size:18px; padding:12px; border-radius:10px; border:1px solid var(--line); background:#fff; width:100%; margin-top:8px; }
  button.pri { background:var(--blue); color:#fff; border-color:var(--blue); }
  button.ok { background:var(--green); color:#fff; border-color:var(--green); font-size:26px; padding:20px; }
  button.no { background:var(--red); color:#fff; border-color:var(--red); font-size:26px; padding:20px; }
  button.gray { background:#eef0f3; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  .bar { display:flex; justify-content:space-between; align-items:center; background:var(--txt); color:#fff; padding:10px 12px; border-radius:10px; margin-bottom:10px; font-size:15px; }
  .bar button { width:auto; margin:0; padding:6px 12px; font-size:14px; }
  .tabs { display:flex; gap:6px; margin-bottom:10px; } .tabs button { margin:0; font-size:16px; padding:10px; }
  .tabs button.on { background:var(--blue); color:#fff; border-color:var(--blue); }
  .band { padding:8px 12px; border-radius:8px; font-weight:600; margin-bottom:10px; }
  .big { font-size:30px; font-weight:700; }
  .warn { background:#FAEEDA; color:var(--amber); border-radius:8px; padding:8px 10px; margin:8px 0; font-size:15px; }
  .err { background:#FCEBEB; color:var(--red); border-radius:8px; padding:8px 10px; margin:8px 0; font-size:15px; }
  .done { background:#E1F5EE; color:var(--green); border-radius:10px; padding:16px; text-align:center; }
  .muted { color:var(--sub); font-size:14px; }
  #reader { width:100%; border-radius:10px; overflow:hidden; border:4px solid transparent; transition:border-color .15s; }
  #reader.hit { border-color:#1D9E75; }
  .who-row { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin:4px 0 6px; flex-wrap:wrap; }
  .who-name { font-size:24px; font-weight:700; } .who-ratio { font-size:19px; color:var(--txt); }
  #suggest .sg { display:block; width:100%; text-align:left; margin:6px 0 0; padding:10px 12px; font-size:16px; border-radius:10px; }
  #suggest .sg b { font-size:19px; margin-right:8px; } #suggest .sg small { display:block; color:var(--sub); font-size:14px; margin-top:2px; }
  #suggest .sg .ck { float:right; font-size:13px; font-weight:700; color:var(--green); background:#E1F5EE; border-radius:6px; padding:1px 7px; }
  #suggest .more { font-size:14px; color:var(--sub); margin-top:6px; }
  .reading { background:#E1F5EE; color:var(--green); border-radius:10px; padding:16px; text-align:center; font-size:22px; font-weight:700; }
  .tip { font-size:14px; color:var(--sub); margin-top:6px; }
  .pg-att { font-size:17px; line-height:1.7; } .pg-att b { font-size:24px; }
  .pill { display:inline-block; padding:2px 8px; border-radius:6px; font-size:13px; font-weight:600; white-space:nowrap; flex-shrink:0; }
  .p-wait { background:#F1EFE8; color:#5F5E5A; } .p-run { background:#E6F1FB; color:#185FA5; } .p-done { background:#E1F5EE; color:#0F6E56; } .p-ng { background:#FCEBEB; color:#A32D2D; }
  .pg-t { border-top:1px solid var(--line); padding:10px 0; } .pg-t:first-child { border-top:0; }
  .pg-h { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; font-size:16px; font-weight:600; }
  .pg-bar { height:8px; background:#eef0f3; border-radius:5px; margin:6px 0; } .pg-bar div { height:8px; border-radius:5px; background:#378ADD; }
  .pg-r { font-size:15px; color:var(--txt); }
  .hidden { display:none; }
  table { width:100%; border-collapse:collapse; font-size:14px; } td, th { border-bottom:1px solid var(--line); padding:6px 4px; text-align:left; }
</style>
</head>
<body>
<div class="wrap">

  <!-- 登入 -->
  <div id="vLogin" class="card">
    <h1 id="title">區權會現場系統</h1>
    <label>機號</label>
    <select id="lMachine"></select>
    <label>人員</label>
    <select id="lStaff"></select>
    <label>密碼（4 碼）</label>
    <input id="lPin" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
    <div id="lErr"></div>
    <button class="pri" onclick="doLogin()">開始</button>
    <p class="muted" id="ver"></p>
  </div>

  <!-- 主畫面 -->
  <div id="vMain" class="hidden">
    <div class="bar"><span id="who"></span><button onclick="logout()">換人</button></div>
    <div class="tabs" id="tabs"></div>

    <div id="scanBox" class="card">
      <div id="reader"></div>
      <div class="row">
        <button id="camBtn" class="gray" onclick="toggleCam()">開啟相機</button>
        <button class="gray" onclick="$('photo').click()">拍照掃描</button>
      </div>
      <input id="photo" type="file" accept="image/*" capture="environment" class="hidden" onchange="photoScan(this)">
      <div id="photoReader" class="hidden"></div>
      <div class="tip" id="camTip">掃描訣竅：選票離鏡頭約 15～25 公分，讓 QR 填滿框框的一半以上；光線不足時打開燈光。掃到時會「嗶」一聲、框變綠色。</div>
      <label id="codeLabel">掃描槍或手動輸入（輸入完按 Enter）</label>
      <input id="code" autocomplete="off" placeholder="例：B1-02F">
      <div id="suggest"></div>
      <div id="manualTopicBox">
        <label>手動輸入戶別時，請選議題</label>
        <select id="manualTopic"></select>
      </div>
      <div id="scanErr"></div>
    </div>

    <div id="panel"></div>
    <div id="admin" class="hidden"></div>
    <div id="progress" class="hidden"></div>
  </div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script type="application/json" id="bootData"><?!= boot ?></script>
<script>
// 外部網址模式用：Apps Script 部署網址（或只填部署 ID）
var API_URL = 'AKfycbx7LtX7NcmDN83ey5ZL7J5dXfcdZ3UWeCWXd4OU-UAgkTOr5n57QGmazok0g2j7a9YM';   // 未來21 的 Apps Script 部署 ID
var PAGE_VERSION = 'v0.7.0';
var BOOT = null, API_MODE = false;
try { BOOT = JSON.parse(document.getElementById('bootData').textContent); } catch (e) { API_MODE = true; }
var AUTH = null, ME = null, MODE = '唱票', BUSY = false, LAST = { t: '', at: 0 }, CAM = null, UNDO_TIMER = null;

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function apiUrl() {
  var q = (location.search.match(/[?&]api=([^&]+)/) || [])[1];
  if (q) { try { localStorage.setItem('av_api', decodeURIComponent(q)); } catch (e) {} }
  var u = q ? decodeURIComponent(q) : API_URL;
  if (!u) { try { u = localStorage.getItem('av_api') || ''; } catch (e) {} }
  if (u && u.indexOf('http') !== 0) u = 'https://script.google.com/macros/s/' + u + '/exec';
  return u;
}
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (API_MODE) {
    var u = apiUrl();
    if (!u) return Promise.reject('沒有設定 API 網址（網址後面加 ?api=部署ID）');
    return fetch(u, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (r) { return r.json(); }, function () { throw '網路連線失敗，請確認手機有網路後再試一次'; })
      .then(function (x) { if (!x.ok) throw x.error; return x.result; });
  }
  return new Promise(function (ok, bad) {
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function (e) { bad(e && e.message ? e.message : String(e)); });
    r[fn].apply(r, args);
  });
}
function colorOf(name) {
  var n = String(name || '');
  var map = [['紅', '#FBEAF0', '#72243E'], ['粉', '#FBEAF0', '#72243E'], ['橘', '#FAECE7', '#712B13'], ['黃', '#FAEEDA', '#633806'],
             ['米', '#F1EFE8', '#444441'], ['綠', '#EAF3DE', '#27500A'], ['藍', '#E6F1FB', '#0C447C'], ['紫', '#EEEDFE', '#3C3489'],
             ['灰', '#F1EFE8', '#444441'], ['白', '#F1EFE8', '#444441']];
  for (var i = 0; i < map.length; i++) if (n.indexOf(map[i][0]) >= 0) return { bg: map[i][1], fg: map[i][2] };
  return { bg: '#E6F1FB', fg: '#0C447C' };
}
function band(t) { var c = colorOf(t.color); return '<div class="band" style="background:' + c.bg + ';color:' + c.fg + '">議題 ' + esc(t.label || ('0' + t.no).slice(-2)) + (t.color ? '・' + esc(t.color) + '色票' : '') + '<br><span style="font-weight:400">' + esc(t.title) + '</span></div>'; }
function warnHtml(ws) { return (ws || []).map(function (w) { return '<div class="warn">⚠ ' + esc(w) + '</div>'; }).join(''); }
function showErr(el, msg) { $(el).innerHTML = msg ? '<div class="err">' + esc(msg) + '</div>' : ''; }

/* ---------- 登入 ---------- */
function boot() {
  if (!API_MODE) { init(); return; }
  $('ver').textContent = '連線中…';
  call('publicInfo').then(function (b) { BOOT = b; init(); })
    .catch(function (m) { $('ver').textContent = ''; showErr('lErr', '無法連線到現場系統：' + m); });
}
function init() {
  $('title').textContent = (BOOT.community || '') + ' 現場系統';
  $('ver').textContent = '畫面 ' + PAGE_VERSION + '｜系統 ' + BOOT.version + '　案件 ' + BOOT.code;
  var m = ''; for (var i = 1; i <= 12; i++) m += '<option value="' + i + '號機">' + i + ' 號機</option>';
  $('lMachine').innerHTML = m;
  $('lStaff').innerHTML = BOOT.staff.map(function (s) { return '<option value="' + esc(s.id) + '">' + esc(s.name) + '（' + esc(s.role) + '）</option>'; }).join('');
  $('manualTopic').innerHTML = '<option value="">（請選擇）</option>' + BOOT.topics.map(function (t) { return '<option value="' + t.no + '">議題 ' + esc(t.label || t.no) + '　' + esc(t.title) + '</option>'; }).join('');
  try { var saved = JSON.parse(sessionStorage.getItem('av_auth') || 'null'); if (saved) { AUTH = saved.auth; ME = saved.me; enter(); } } catch (e) {}
  $('code').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var v = $('code').value.trim();
    if (MODE === '報到' && SG.length === 1 && v.indexOf('|') < 0) v = SG[0].unit;   // 查詢只有一筆：按 Enter 直接帶出
    $('code').value = ''; $('suggest').innerHTML = ''; SG = [];
    if (v) handle(v, true);
  });
  $('code').addEventListener('input', function () {
    if (MODE !== '報到') return;
    clearTimeout(SG_T);
    var v = $('code').value.trim();
    if (!v || v.indexOf('|') >= 0) { $('suggest').innerHTML = ''; SG = []; return; }
    SG_T = setTimeout(function () { searchUnits(v); }, 350);
  });
}
boot();

function doLogin() {
  var a = { machine: $('lMachine').value, staffId: $('lStaff').value, pin: $('lPin').value.trim() };
  showErr('lErr', '');
  call('login', a).then(function (me) {
    AUTH = a; ME = me;
    try { sessionStorage.setItem('av_auth', JSON.stringify({ auth: a, me: me })); } catch (e) {}
    enter();
  }).catch(function (m) { showErr('lErr', m); });
}
function logout() {
  stopCam();
  AUTH = null; ME = null;
  try { sessionStorage.removeItem('av_auth'); } catch (e) {}
  $('lPin').value = ''; $('vMain').classList.add('hidden'); $('vLogin').classList.remove('hidden');
}
function enter() {
  $('vLogin').classList.add('hidden'); $('vMain').classList.remove('hidden');
  $('who').textContent = ME.machine + '・' + ME.name + '（' + ME.role + '）';
  var rs = ME.roles || String(ME.role).split(/[、,，\/／+＋\s]+/);
  var modes = rs.indexOf('監票') >= 0 ? ['報到', '唱票', '管理', '進度'] : ['報到', '唱票'].filter(function (m) { return rs.indexOf(m) >= 0; }).concat(['進度']);
  $('tabs').innerHTML = modes.map(function (m) { return '<button onclick="setMode(\'' + m + '\')" id="tab_' + m + '">' + m + '</button>'; }).join('');
  setMode(rs.indexOf('監票') >= 0 ? '唱票' : modes[0]);
}
var PG_TIMER = null;
function setMode(m) {
  MODE = m; clearPanel();
  if (PG_TIMER) { clearInterval(PG_TIMER); PG_TIMER = null; }
  if (m === '管理' || m === '進度') stopCam();
  document.querySelectorAll('.tabs button').forEach(function (b) { b.classList.toggle('on', b.id === 'tab_' + m); });
  $('scanBox').classList.toggle('hidden', m === '管理' || m === '進度');
  $('admin').classList.toggle('hidden', m !== '管理');
  $('progress').classList.toggle('hidden', m !== '進度');
  $('manualTopicBox').classList.toggle('hidden', m !== '唱票');
  $('codeLabel').textContent = m === '報到' ? '查詢住戶：戶別、樓層、地址或姓名（例：15樓、B17 9F、牛埔東路15之3）' : '掃描槍或手動輸入（輸入完按 Enter）';
  $('code').placeholder = m === '報到' ? '例：15樓' : '例：B1-02F';
  $('suggest').innerHTML = '';
  if (m === '管理') loadAdmin();
  if (m === '進度') { loadProgress(); PG_TIMER = setInterval(loadProgress, 10000); }
}

/* ---------- 相機 ---------- */
function toggleCam() { if (CAM) stopCam(); else startCam(); }
function startCam() {
  if (typeof Html5Qrcode === 'undefined') { showErr('scanErr', '相機元件載入失敗，請改用掃描槍或手動輸入'); return; }
  unlockBeep();
  try { $('code').blur(); } catch (e) {}
  LAST_MANUAL = false;
  var fmt = (typeof Html5QrcodeSupportedFormats !== 'undefined') ? [Html5QrcodeSupportedFormats.QR_CODE] : undefined;
  CAM = new Html5Qrcode('reader', { formatsToSupport: fmt, experimentalFeatures: { useBarCodeDetectorIfSupported: true }, verbose: false });
  CAM.start({ facingMode: 'environment' }, {
      fps: 20,
      qrbox: function (w, h) { var s = Math.floor(Math.min(w, h) * 0.8); return { width: s, height: s }; },
      videoConstraints: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    }, function (text) { handle(text, false); })
    .then(function () { $('camBtn').textContent = '關閉相機'; showErr('scanErr', ''); })
    .catch(function (e) {
      CAM = null;
      showErr('scanErr', API_MODE ? '無法開啟相機，請確認已允許相機權限；也可以按「拍照掃描」或手動輸入'
                                  : 'Google 網址不能使用即時相機：請改用 GitHub 掃描網址，或按「拍照掃描」、手動輸入');
    });
}
// 拍照掃描：開手機相機拍一張，從照片讀 QR（任何瀏覽器都能用）
function photoScan(inp) {
  var f = inp.files && inp.files[0];
  inp.value = '';
  if (!f) return;
  if (typeof Html5Qrcode === 'undefined') { showErr('scanErr', '掃描元件載入失敗，請改用手動輸入'); return; }
  showErr('scanErr', '');
  new Html5Qrcode('photoReader').scanFile(f, false)
    .then(function (text) { LAST = { t: '', at: 0 }; handle(text, false); })
    .catch(function () { showErr('scanErr', '照片裡找不到 QR，請靠近一點、對準 QR 再拍一次'); });
}
// 掃到時的提示：嗶聲＋震動（Android）＋綠框
var AC = null;
function unlockBeep() { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} }
function beep(ok) {
  try {
    if (!AC) return;
    var o = AC.createOscillator(), g = AC.createGain();
    o.frequency.value = ok ? 1320 : 330; g.gain.value = 0.25;
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + (ok ? 0.12 : 0.3));
  } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate(ok ? 80 : [60, 60, 60]); } catch (e) {}
}
function camPause() { try { if (CAM && CAM.getState && CAM.getState() === 2) CAM.pause(true); } catch (e) {} }
function camResume() { try { if (CAM && CAM.getState && CAM.getState() === 3) CAM.resume(); } catch (e) {} $('reader').classList.remove('hit'); }
function stopCam() {
  if (!CAM) return;
  var c = CAM; CAM = null;
  c.stop().then(function () { c.clear(); }).catch(function () {});
  $('camBtn').textContent = '開啟相機';
}

/* ---------- 掃描分派 ---------- */
function handle(text, manual) {
  if (BUSY) return;
  var now = Date.now();
  if (!manual && text === LAST.t && now - LAST.at < 4000) return;
  LAST = { t: text, at: now };
  BUSY = true; showErr('scanErr', '');
  LAST_MANUAL = !!manual;
  SCAN_AT = Date.now();      // 掃到（或輸入完按 Enter）的時間，送出時一起傳回去算處理秒數
  if (!manual) { try { $('code').blur(); } catch (e) {} }
  if (!manual) { beep(true); $('reader').classList.add('hit'); camPause(); }
  var shown = (String(text).split('|')[1] || text).trim();
  $('panel').innerHTML = '<div class="card"><div class="reading">已讀到 ' + esc(shown) + '<br><span style="font-size:15px;font-weight:400">查詢中…</span></div></div>';
  if (MODE === '報到') checkinLookup(text);
  else voteLookup(text, manual ? $('manualTopic').value : '');
}
// 關閉面板後 4 秒內，相機看到同一張票不會再觸發（避免票還在鏡頭前被重掃）
// 只有上一筆是「掃描槍／手動輸入」才把游標放回輸入框；用相機掃時不碰輸入框（避免手機跳出鍵盤）
var LAST_MANUAL = false, SCAN_AT = 0;
function secs() { return SCAN_AT ? Math.round((Date.now() - SCAN_AT) / 100) / 10 : ''; }
function clearPanel() { if (UNDO_TIMER) { clearInterval(UNDO_TIMER); UNDO_TIMER = null; } $('panel').innerHTML = ''; BUSY = false; LAST.at = Date.now(); camResume(); if (LAST_MANUAL && !CAM) $('code').focus(); }
function fail(m) { beep(false); $('panel').innerHTML = '<div class="card"><div class="err">' + esc(m) + '</div><button onclick="clearPanel()">繼續掃描</button></div>'; }

/* ---------- 報到：模糊查詢 ---------- */
var SG = [], SG_T = null, SG_Q = '';
function searchUnits(v) {
  SG_Q = v;
  $('suggest').innerHTML = '<div class="more">查詢中…</div>';
  call('searchRoster', AUTH, v).then(function (r) {
    if (SG_Q !== v || $('code').value.trim() !== v) return;          // 已經改打別的字，略過舊結果
    SG = r.items;
    if (!r.items.length) { $('suggest').innerHTML = '<div class="more">找不到符合「' + esc(v) + '」的住戶</div>'; return; }
    $('suggest').innerHTML = r.items.map(function (h, i) {
      return '<button class="sg gray" onclick="pickUnit(' + i + ')">' + (h.checked ? '<span class="ck">已報到</span>' : '') +
        '<b>' + esc(h.unit) + '</b>' + esc(h.name) + '<small>' + esc(h.address || '') + '　比例 ' + (h.ratio * 100).toFixed(2) + '%</small></button>';
    }).join('') + (r.total > r.items.length ? '<div class="more">共 ' + r.total + ' 戶，只列前 ' + r.items.length + ' 戶，請多打幾個字縮小範圍</div>' : '');
  }).catch(function (m) { $('suggest').innerHTML = '<div class="more">' + esc(m) + '</div>'; });
}
function pickUnit(i) {
  var h = SG[i]; if (!h) return;
  $('code').value = ''; $('suggest').innerHTML = ''; SG = [];
  try { $('code').blur(); } catch (e) {}
  handle(h.unit, true);
}

/* ---------- 報到 ---------- */
var CK = null;
function checkinLookup(text) {
  call('lookupCheckin', AUTH, text).then(function (r) {
    CK = r;
    var prev = r.previous.length ? '<div class="warn">⚠ 已報到過：' + r.previous.map(function (p) { return esc(p.time + ' ' + p.mode + (p.proxy ? '（' + p.proxy + '）' : '') + ' ' + p.machine); }).join('；') + '</div>' : '';
    $('panel').innerHTML = '<div class="card"><div class="big">' + esc(r.unit) + '</div>' +
      '<div class="who-row"><span class="who-name">' + esc(r.name) + '</span><span class="who-ratio">比例 ' + (r.ratio * 100).toFixed(2) + '%</span></div>' +
      (r.address ? '<div class="muted" style="font-size:16px;margin-bottom:6px">' + esc(r.address) + '</div>' : '') + prev +
      '<button class="ok" onclick="ckSubmit(\'本人\')">本人報到</button>' +
      '<button class="pri" onclick="ckProxyForm()">委託報到（授權書）</button><div id="ckForm"></div>' +
      '<button onclick="clearPanel()">取消</button></div>';
  }).catch(fail);
}
function ckProxyForm() {
  $('ckForm').innerHTML = '<label>受託人姓名</label><input id="pName">' +
    '<label>受託人身分</label><select id="pType"><option value="">（可會後補登）</option><option>配偶</option><option>直系血親</option><option>其他區權人</option><option>承租人</option><option>其他</option></select>' +
    '<label>授權書編號</label><input id="pNo" inputmode="numeric">' +
    '<button class="ok" onclick="ckSubmit(\'委託\')">確認委託報到</button>';
  $('pName').focus();
}
function ckSubmit(mode) {
  var pn = mode === '委託' ? $('pName').value : '', pt = mode === '委託' ? $('pType').value : '', no = mode === '委託' ? $('pNo').value : '';
  call('doCheckin', AUTH, CK.unit, mode, pn, pt, no, '', secs()).then(function (r) {
    $('panel').innerHTML = '<div class="card"><div class="done"><div class="big">' + esc(CK.unit) + ' ✓</div>' + esc(mode) + '報到完成' + (r.status === '重複' ? '（重複，只計一次）' : '') + '</div>' +
      warnHtml(r.warnings) + '<button class="pri" onclick="clearPanel()">下一位</button></div>';
    if (!r.warnings.length) setTimeout(function () { if (BUSY) clearPanel(); }, 2500);
  }).catch(fail);
}

/* ---------- 唱票 ---------- */
var CUR = null;
function voteLookup(text, manualTopic) {
  call('scanVote', AUTH, text, manualTopic).then(function (r) {
    CUR = r;
    var head = band(r.topic) + '<div class="big">' + esc(r.unit) + '</div><div class="muted">' + esc(r.masked) + '</div>' + warnHtml(r.warnings);
    if (r.state === 'locked') { $('panel').innerHTML = '<div class="card">' + head + '<div class="err">此議題已宣布結果，需由監票人員處理</div><button onclick="clearPanel()">繼續掃描</button></div>'; return; }
    if (r.state === 'exists') {
      var rec = r.record;
      $('panel').innerHTML = '<div class="card">' + head + '<div class="warn">這張已登錄為「<b>' + esc(rec.result) + '</b>」<br>' + esc(rec.time + '　' + rec.machine + '　' + rec.staff) + '</div>' +
        '<button class="pri" onclick="clearPanel()">維持原結果</button>' + correctButtons(r.topic, rec) + '</div>';
      return;
    }
    $('panel').innerHTML = '<div class="card">' + head + voteButtons(r.topic) + '<button onclick="clearPanel()">取消</button></div>';
    if (r.topic.kind === '選舉') $('cand').focus();
  }).catch(fail);
}
function optionButtons(t, fn, exclude) {
  return (t.options || []).filter(function (o) { return o.label !== exclude; }).map(function (o, i) {
    return '<button class="' + (fn === 'submit' ? (i % 2 ? 'no' : 'ok') : 'gray') + '" onclick="' + fn + '(\'' + o.label + '\')">' +
      (fn === 'correct' ? '更正為「' + esc(o.label) + '」' : esc(o.label)) + (o.desc ? '<br><span style="font-size:15px;font-weight:400">' + esc(o.desc) + '</span>' : '') + '</button>';
  }).join('');
}
function voteButtons(t) {
  if (t.kind === '方案') return optionButtons(t, 'submit') + '<button class="gray" onclick="submit(\'廢票\')">廢票</button>';
  if (t.kind === '表決') return '<div class="row"><button class="ok" onclick="submit(\'同意\')">同意</button><button class="no" onclick="submit(\'不同意\')">不同意</button></div><button class="gray" onclick="submit(\'廢票\')">廢票</button>';
  return '<label>票上所寫的候選人戶號</label><input id="cand" autocomplete="off" placeholder="例：B1-07F"><button class="ok" onclick="submit($(\'cand\').value)">確認</button><button class="gray" onclick="submit(\'廢票\')">廢票</button>';
}
function correctButtons(t, rec) {
  if (t.kind === '方案') return optionButtons(t, 'correct', rec.result) + (rec.result !== '廢票' ? '<button class="gray" onclick="correct(\'廢票\')">更正為「廢票」</button>' : '');
  if (t.kind === '表決') return ['同意', '不同意', '廢票'].filter(function (x) { return x !== rec.result; })
    .map(function (x) { return '<button class="gray" onclick="correct(\'' + x + '\')">更正為「' + x + '」</button>'; }).join('');
  return '<label>更正為候選人戶號</label><input id="cand2" autocomplete="off"><button class="gray" onclick="correct($(\'cand2\').value)">更正</button><button class="gray" onclick="correct(\'廢票\')">更正為廢票</button>';
}
function submit(result) {
  if (!String(result || '').trim()) { alert('請輸入候選人戶號，或按廢票'); return; }
  var r = CUR;
  call('submitVote', AUTH, r.unit, r.topic.no, result, secs()).then(function (x) {
    if (x.state === 'exists') { CUR.state = 'exists'; CUR.record = x.record; voteLookupRender(); return; }
    var sec = 5;
    $('panel').innerHTML = '<div class="card">' + band(r.topic) + '<div class="done"><div class="big">' + esc(r.unit) + ' → ' + esc(x.result) + ' ✓</div>' +
      (x.note ? '<div class="warn">' + esc(x.note) + '</div>' : '') + '</div>' +
      '<button id="undoBtn" class="gray" onclick="undo(\'' + x.id + '\')">復原（5）</button></div>';
    UNDO_TIMER = setInterval(function () {
      sec--;
      if (sec <= 0) { clearPanel(); return; }
      var b = $('undoBtn'); if (b) b.textContent = '復原（' + sec + '）';
    }, 1000);
  }).catch(fail);
}
function voteLookupRender() {
  var r = CUR, rec = r.record;
  $('panel').innerHTML = '<div class="card">' + band(r.topic) + '<div class="big">' + esc(r.unit) + '</div><div class="warn">另一台手機已登錄為「<b>' + esc(rec.result) + '</b>」<br>' +
    esc(rec.time + '　' + rec.machine + '　' + rec.staff) + '</div><button class="pri" onclick="clearPanel()">維持原結果</button>' + correctButtons(r.topic, rec) + '</div>';
}
function undo(id) {
  if (UNDO_TIMER) { clearInterval(UNDO_TIMER); UNDO_TIMER = null; }
  call('undoVote', AUTH, id).then(function () {
    CUR.state = 'new';
    $('panel').innerHTML = '<div class="card">' + band(CUR.topic) + '<div class="big">' + esc(CUR.unit) + '</div><div class="muted">已復原，請重新選擇</div>' + voteButtons(CUR.topic) + '<button onclick="clearPanel()">取消</button></div>';
  }).catch(fail);
}
function correct(newResult) {
  if (!String(newResult || '').trim()) { alert('請輸入更正後的內容'); return; }
  if (!confirm('確定將 ' + CUR.unit + ' 由「' + CUR.record.result + '」更正為「' + newResult + '」？\n系統會保留更正紀錄。')) return;
  call('correctVote', AUTH, CUR.record.id, newResult).then(function (x) {
    $('panel').innerHTML = '<div class="card"><div class="done"><div class="big">' + esc(CUR.unit) + ' → ' + esc(x.result || newResult) + ' ✓</div>' + (x.unchanged ? '結果相同，未變更' : '已更正並留下紀錄') + '</div><button class="pri" onclick="clearPanel()">繼續掃描</button></div>';
  }).catch(fail);
}

/* ---------- 進度（所有人員可看，每 10 秒更新） ---------- */
function pct(x) { return (Math.round((x || 0) * 1000) / 10).toFixed(1) + '%'; }
function loadProgress() {
  if (!$('progress').innerHTML) $('progress').innerHTML = '<div class="card muted">載入中…</div>';
  call('getDashboard').then(function (d) {
    var a = d.attendance;
    var att = '<div class="card pg-att"><h1>出席</h1>出席 <b>' + a.all.units + '</b> 戶　人數 ' + pct(a.all.peoplePct) + '　比例 ' + pct(a.all.ratio) +
      (a.all.units !== a.legal.units ? '<br><span class="muted">依法可計入 ' + a.legal.units + ' 戶・' + pct(a.legal.ratio) + '</span>' : '') +
      '<br>' + (a.legal.ok ? '<span class="pill p-done">已達開會門檻</span>' : '<span class="pill p-ng">未達開會門檻（需 ' + pct(a.need) + '）</span>') + '</div>';
    var done = d.topics.filter(function (t) { return t.status === '已宣布'; }).length;
    var list = d.topics.map(function (t) {
      var pill = t.status === '已宣布' ? 'p-done' : t.status === '統計中' ? 'p-run' : 'p-wait';
      var p = t.expected ? Math.min(100, Math.round(t.scanned / t.expected * 100)) : 0;
      var res = '';
      if (t.kind === '表決' && t.scanned) res = '同意 <b>' + t['同意'].votes + '</b>　不同意 <b>' + t['不同意'].votes + '</b>　廢票 ' + t['廢票'].votes +
        (t.status === '已宣布' ? '　→ <b>' + (t.pass ? '通過' : '未通過') + '</b>' : '');
      if (t.kind === '方案' && t.scanned) res = t.options.map(function (o) { return esc(o.label) + ' <b>' + o.votes + '</b>'; }).join('　') + '　廢票 ' + t['廢票'].votes +
        (t.status === '已宣布' ? '　→ <b>' + (t.tie ? '同票' : esc(t.winner) + ' 較高') + '</b>' : '');
      if (t.kind === '選舉' && t.scanned) res = (t.ranking || []).slice(0, 3).map(function (r) { return esc(r.unit) + ' ' + r.votes; }).join('　');
      return '<div class="pg-t"><div class="pg-h"><span>議題 ' + esc(t.label || t.no) + '　' + esc(t.title) + '</span><span class="pill ' + pill + '">' + esc(t.status) + '</span></div>' +
        (t.status === '未開始' && !t.scanned ? '' : '<div class="pg-bar"><div style="width:' + p + '%"></div></div><div class="pg-r">已唱 ' + t.scanned + '／' + t.expected + ' 張' + (res ? '<br>' + res : '') + '</div>') + '</div>';
    }).join('');
    $('progress').innerHTML = att + '<div class="card"><h1>議題進度（已宣布 ' + done + '／' + d.topics.length + '）</h1>' + list +
      '<p class="muted">每 10 秒自動更新　' + esc(d.updated || '') + '</p></div>';
  }).catch(function (m) { $('progress').innerHTML = '<div class="card"><div class="err">' + esc(m) + '</div></div>'; });
}

/* ---------- 管理（監票） ---------- */
function loadAdmin() {
  $('admin').innerHTML = '<div class="card muted">載入中…</div>';
  call('adminTopics', AUTH).then(function (ts) {
    var url = BOOT.url ? '<p class="muted">投影畫面網址：<br>' + esc(BOOT.url) + '?page=display</p>' : '';
    $('admin').innerHTML = '<div class="card"><h1>議題狀態</h1><table><tr><th>議題</th><th>狀態</th><th>已唱</th><th></th></tr>' +
      ts.map(function (t) {
        var btn = t.status === '已宣布' ? '<button class="gray" style="margin:0;padding:6px;font-size:14px" onclick="setStatus(' + t.no + ',\'統計中\')">重新開啟</button>'
                                        : '<button class="pri" style="margin:0;padding:6px;font-size:14px" onclick="setStatus(' + t.no + ',\'已宣布\')">宣布結果</button>';
        var res = '';
        if (t.kind === '表決' && t.scanned) res = '<br><span class="muted">同意 ' + t['同意'].votes + '／不同意 ' + t['不同意'].votes + '　' + (t.pass ? '通過' : '未通過') + '</span>';
        if (t.kind === '方案' && t.scanned) res = '<br><span class="muted">' + t.options.map(function (o) { return esc(o.label) + ' ' + o.votes; }).join('／') + '　' + (t.tie ? '同票' : t.winner ? esc(t.winner) + '較高' : '') + '</span>';
        return '<tr><td>' + esc(t.label || t.no) + '. ' + esc(t.title) + res + '</td><td>' + esc(t.status) + '</td><td>' + t.scanned + '/' + t.expected + '</td><td>' + btn + '</td></tr>';
      }).join('') + '</table><button onclick="loadAdmin()">重新整理</button>' + url + '</div>';
  }).catch(function (m) { $('admin').innerHTML = '<div class="card"><div class="err">' + esc(m) + '</div></div>'; });
}
function setStatus(no, st) {
  if (!confirm((st === '已宣布' ? '宣布議題 ' : '重新開啟議題 ') + no + '？' + (st === '已宣布' ? '\n宣布後，唱票人員將無法再更正此題。' : ''))) return;
  call('setTopicStatus', AUTH, no, st).then(loadAdmin).catch(function (m) { alert(m); });
}
</script>
</body>
